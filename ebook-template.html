<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172c54">
  <title>Моя книга — Мама, расскажи</title>
  <link rel="icon" href="assets/images/favicon.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#172c54;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.12)}header img{width:122px}.book{min-height:calc(100dvh - 64px);display:grid;place-items:center;padding:18px}.stage{width:min(100%,1000px)}.spread{display:none}.spread.active{display:block}.spread img{width:100%;height:auto;max-height:74dvh;object-fit:contain;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:14px}.controls button{border:0;border-radius:14px;padding:12px 14px;font-weight:700;cursor:pointer}.next{justify-self:end}.counter{font-size:13px;color:#c8d3e6;text-align:center}.hint{font-size:12px;color:#b9c7df;text-align:center;margin-top:10px}@media(max-width:600px){.book{padding:12px}.spread img{max-height:70dvh;border-radius:12px}}
  </style>
</head>
<body>
<header><img src="assets/images/logo-white.png" alt="Мама, расскажи"><span style="font-size:12px;color:#c8d3e6">Персональная электронная книга</span></header>
<main class="book"><div class="stage"><div id="pages">
  <div class="spread active"><img src="assets/images/books/okean-idey.webp" alt="Обложка книги"></div>
  <div class="spread"><img src="assets/images/previews/okean-idey.webp" alt="Разворот книги"></div>
</div><div class="controls"><button id="prev" type="button">← Назад</button><div class="counter" id="counter">1 / 2</div><button class="next" id="next" type="button">Вперёд →</button></div><div class="hint">Шаблон: замените изображения на страницы конкретной персональной книги.</div></div></main>
<script>
(()=>{const pages=[...document.querySelectorAll('.spread')],c=document.getElementById('counter');let i=0;function show(n){i=Math.max(0,Math.min(pages.length-1,n));pages.forEach((p,k)=>p.classList.toggle('active',k===i));c.textContent=`${i+1} / ${pages.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===pages.length-1}document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);let x=0;document.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)show(i+(d<0?1:-1))},{passive:true});show(0)})();
</script>
</body></html>
